<!DOCTYPE html>
<html>
<head>
    <title>Medical Chatbot - ReAct AI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}?v=7"/>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-12 chat">
                <div class="card">
                    <!-- Header -->
                    <div class="card-header msg_head">
                        <div class="d-flex justify-content-between align-items-center">
                            <!-- Left side: Avatar and Info -->
                            <div class="d-flex align-items-center">
                                <div class="img_cont">
                                    <img src="https://p.turbosquid.com/ts-thumb/ui/yFoz1G/9DV3tqoL/posed/png/1519983872/300x300/sharp_fit_q85/9ffb0b50c120e20b9e3a0877681ed9273e287fe8/posed.jpg" 
                                        class="rounded-circle user_img">
                                    <span class="online_icon"></span>
                                </div>
                                <div class="user_info">
                                    <span>Aceso - Medical AI</span>
                                    <p>Powered by ReAct Architecture</p>
                                </div>
                            </div>

                            <!-- Right side: Buttons -->
                            <div class="d-flex align-items-center" style="gap: 10px;">
                                <button onclick="sendCommand('help')" class="btn btn-sm btn-outline-light header-btn" title="Show help">
                                    <i class="fas fa-question-circle"></i> <span>Help</span>
                                </button>
                                <button onclick="sendCommand('reset')" class="btn btn-sm btn-outline-light header-btn" title="Clear history">
                                    <i class="fas fa-redo"></i> <span>Reset</span>
                                </button>
                                <button class="reasoning-toggle-btn" id="reasoningToggle">
                                    <i class="fas fa-brain"></i>
                                    <span id="reasoningStatus">Reasoning ON</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Messages Area -->
                    <div id="messageFormeight" class="card-body msg_card_body">
                        <!-- Welcome message -->
                        <div class="welcome-message">
                            <h5>👋 Welcome to Aceso Medical Assistant</h5>
                            <p>I can help you with medical information using AI-powered reasoning.</p>
                            <div class="command-hint">
                                <strong>Commands:</strong>
                                <ul>
                                    <li><code>help</code> - Show all commands</li>
                                    <li><code>reset</code> - Clear conversation history</li>
                                    <li><code>reasoning on/off</code> - Toggle reasoning display</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Input Area -->
                    <div class="card-footer">
                        <form id="messageArea" class="input-group">
                            <input type="text" 
                                   id="text" 
                                   name="msg" 
                                   placeholder="Type your medical question..." 
                                   autocomplete="off" 
                                   class="form-control type_msg" 
                                   required/>
                            <div class="input-group-append">
                                <button type="submit" id="send" class="input-group-text send_btn">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let reasoningEnabled = true;

        $(document).ready(function() {
            // Reasoning toggle button handler — only affects reasoning sections, never the outer bubble
            $("#reasoningToggle").on("click", function() {
                reasoningEnabled = !reasoningEnabled;

                if (reasoningEnabled) {
                    $("#reasoningStatus").text("Reasoning ON");
                    $(this).css("background", "linear-gradient(135deg, #667eea 0%, #764ba2 100%)");
                    $(".reasoning-section").removeClass("hidden");
                } else {
                    $("#reasoningStatus").text("Reasoning OFF");
                    $(this).css("background", "linear-gradient(135deg, #6b7280 0%, #4b5563 100%)");
                    $(".reasoning-section").addClass("hidden");
                }
            });

            // Set initial button state
            $("#reasoningToggle").addClass("btn-primary");

            // Message submission
            $("#messageArea").on("submit", function(event) {
                event.preventDefault();
                
                const date = new Date();
                const hour = date.getHours().toString().padStart(2, '0');
                const minute = date.getMinutes().toString().padStart(2, '0');
                const str_time = hour + ":" + minute;
                const rawText = $("#text").val().trim();

                if (!rawText) return;

                // Display user message
                const userHtml = `
                    <div class="d-flex justify-content-end mb-4">
                        <div class="msg_cotainer_send">
                            ${escapeHtml(rawText)}
                            <span class="msg_time_send">${str_time}</span>
                        </div>
                        <div class="img_cont_msg">
                            <img src="https://i.ibb.co/d5b84Xw/Untitled-design.png"
                                 class="rounded-circle user_img_msg">
                        </div>
                    </div>
                `;
                
                $("#text").val("");
                $("#messageFormeight").append(userHtml);
                scrollToBottom();

                // Show typing indicator
                showTypingIndicator();

                // Send request
                $.ajax({
                    data: {
                        msg: rawText,
                        show_reasoning: reasoningEnabled
                    },
                    type: "POST",
                    url: "/get",
                    timeout: 180000,
                    dataType: "json"  // Expect JSON response
                }).done(function(data) {
                    hideTypingIndicator();
                    
                    // Build HTML from JSON response
                    const formattedResponse = buildResponseFromJSON(data);

                    const botHtml = `
                        <div class="d-flex justify-content-start align-items-start mb-4">
                            <div class="img_cont_msg" style="flex-shrink:0;">
                                <img src="https://img.icons8.com/color/96/medical-doctor.png"
                                     class="rounded-circle bot_avatar_img">
                            </div>
                            <div class="msg_cotainer">
                                ${formattedResponse || '<div class="answer-section"><div class="answer-content"><p>No response received.</p></div></div>'}
                                <span class="msg_time">${str_time}</span>
                            </div>
                        </div>
                    `;

                    $("#messageFormeight").append(botHtml);
                    scrollToBottom();

                    // Make reasoning sections collapsible
                    initializeReasoningCollapse();
                    
                }).fail(function(jqXHR, textStatus, errorThrown) {
                    hideTypingIndicator();
                    
                    const errorHtml = `
                        <div class="d-flex justify-content-start mb-4">
                            <div class="img_cont_msg">
                                <img src="https://img.icons8.com/color/96/medical-doctor.png" 
                                     class="rounded-circle bot_avatar_img">
                            </div>
                            <div class="msg_cotainer error-message">
                                ⚠️ <strong>Error:</strong> ${textStatus === 'timeout' ? 'Request timed out. Please try a simpler question.' : 'Something went wrong. Please try again.'}
                                <span class="msg_time">${str_time}</span>
                            </div>
                        </div>
                    `;
                    
                    $("#messageFormeight").append(errorHtml);
                    scrollToBottom();
                });
            });

            // Helper functions
            function showTypingIndicator() {
                const typingHtml = `
                    <div id="typing" class="d-flex justify-content-start mb-4">
                        <div class="img_cont_msg">
                            <img src="https://img.icons8.com/color/96/medical-doctor.png"
                                 class="rounded-circle bot_avatar_img">
                        </div>
                        <div class="typing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                `;
                $("#messageFormeight").append(typingHtml);
                scrollToBottom();
            }

            function hideTypingIndicator() {
                $("#typing").remove();
            }

            function scrollToBottom() {
                const msgBody = $("#messageFormeight");
                msgBody.scrollTop(msgBody[0].scrollHeight);
            }

            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            // ============================================================================
            // BUILD RESPONSE FROM JSON - Main function to handle all response types
            // ============================================================================
            function buildResponseFromJSON(data) {
                if (!data) return '<div class="error-message">No response received</div>';
                
                // Handle different response types
                switch(data.type) {
                    case 'answer':
                        return buildAnswerResponse(data);
                    case 'command':
                        return buildCommandResponse(data);
                    case 'error':
                        return buildErrorResponse(data);
                    default:
                        return buildAnswerResponse(data);
                }
            }
            
            // Build answer response (main chat responses)
            function buildAnswerResponse(data) {
                let html = '';
                
                // Add reasoning section if present and enabled
                if (data.reasoning && data.show_reasoning && reasoningEnabled) {
                    html += `
                        <div class="reasoning-section">
                            <div class="reasoning-header">
                                <i class="fas fa-brain"></i> Reasoning Process
                                <i class="fas fa-chevron-down toggle-icon"></i>
                            </div>
                            <div class="reasoning-content">
                                ${formatReasoningTrace(data.reasoning)}
                            </div>
                        </div>
                    `;
                }
                
                // Add answer section
                html += `<div class="answer-section">${formatAnswer(data.answer)}</div>`;
                
                // Add sources if present
                if (data.sources && data.sources.length > 0) {
                    html += '<div class="sources-section"><strong>📚 Sources:</strong><ul>';
                    data.sources.forEach(source => {
                        // Parse markdown links [Title](URL) → <a href="URL">Title</a>
                        const linked = source.replace(
                            /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
                            '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
                        );
                        html += `<li class="source-item">${linked}</li>`;
                    });
                    html += '</ul></div>';
                }
                
                // Add disclaimer only when answer is not itself a safety block
                const isSafetyBlock = data.answer && data.answer.startsWith("⚠️ I cannot provide");
                if (data.disclaimer && !isSafetyBlock) {
                    html += `<div class="disclaimer">${escapeHtml(data.disclaimer)}</div>`;
                }
                
                return html;
            }
            
            // Build command response (reset, help, etc.)
            function buildCommandResponse(data) {
                let html = '';
                
                // Different styling based on command type
                let iconClass = 'info';
                if (data.command === 'reset') iconClass = 'success';
                else if (data.command === 'help') iconClass = 'info';
                else if (data.command === 'reasoning_toggle') iconClass = 'warning';
                
                html += `<div class="command-response ${iconClass}">`;
                html += `<strong>${escapeHtml(data.message)}</strong>`;
                
                if (data.details) {
                    html += `<p>${escapeHtml(data.details)}</p>`;
                }
                
                // Handle help command sections
                if (data.sections) {
                    data.sections.forEach(section => {
                        html += `<div class="help-section">`;
                        html += `<strong>${escapeHtml(section.title)}:</strong><ul>`;
                        section.items.forEach(item => {
                            html += `<li>${escapeHtml(item)}</li>`;
                        });
                        html += `</ul></div>`;
                    });
                }
                
                if (data.disclaimer) {
                    html += `<div class="disclaimer">${escapeHtml(data.disclaimer)}</div>`;
                }
                
                html += '</div>';
                return html;
            }
            
            // Build error response
            function buildErrorResponse(data) {
                let html = `<div class="error-response">`;
                html += `<strong>${escapeHtml(data.message)}</strong>`;
                
                if (data.details) {
                    html += `<p>${escapeHtml(data.details)}</p>`;
                }
                
                if (data.suggestions && data.suggestions.length > 0) {
                    html += '<strong>Try these strategies:</strong><ul>';
                    data.suggestions.forEach(suggestion => {
                        html += `<li>${escapeHtml(suggestion)}</li>`;
                    });
                    html += '</ul>';
                }
                
                html += '</div>';
                return html;
            }

            function formatReasoningTrace(reasoning) {
                // Parse reasoning steps
                let formatted = reasoning
                    .replace(/🧠 \*\*Thought (\d+):\*\* /g, '<div class="thought-step"><strong>💭 Thought $1:</strong> ')
                    .replace(/🎬 \*\*Action:\*\* /g, '<br><strong>⚡ Action:</strong> ')
                    .replace(/📝 \*\*Input:\*\* /g, '<br><strong>📝 Input:</strong> ')
                    .replace(/👁️ \*\*Observation:\*\* /g, '</div><div class="observation-step"><strong>👁️ Observation:</strong> ')
                    .replace(/\n-{50,}/g, '</div>');

                // Balance any unclosed divs (last thought/observation step is never closed by patterns above)
                const opens = (formatted.match(/<div/g) || []).length;
                const closes = (formatted.match(/<\/div>/g) || []).length;
                formatted += '</div>'.repeat(Math.max(0, opens - closes));

                return `<div class="reasoning-trace">${formatted}</div>`;
            }

            function formatAnswer(answer) {
                if (!answer) return '<div class="answer-content"><p>No response available.</p></div>';

                const raw = String(answer);

                // Split into paragraphs first (double newline = new paragraph)
                const paragraphs = raw.split(/\n\n+/);

                function processInline(line) {
                    return line
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
                            '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                }

                let html = '';
                for (const para of paragraphs) {
                    const trimmed = para.trim();
                    if (!trimmed) continue;

                    // Heading
                    if (/^## /.test(trimmed)) {
                        html += `<h3>${processInline(trimmed.replace(/^## /, ''))}</h3>`;
                    } else if (/^# /.test(trimmed)) {
                        html += `<h2>${processInline(trimmed.replace(/^# /, ''))}</h2>`;
                    // Horizontal rule
                    } else if (/^---+$/.test(trimmed)) {
                        html += '<hr>';
                    // List block (any line starts with - or •)
                    } else if (/^[\-•]\s+/m.test(trimmed)) {
                        const items = trimmed.split('\n').map(line => {
                            const m = line.match(/^[\-•]\s+(.+)$/);
                            return m ? `<li>${processInline(m[1])}</li>` : `<p>${processInline(line)}</p>`;
                        }).join('');
                        html += `<ul>${items}</ul>`;
                    // Normal paragraph
                    } else {
                        const lines = trimmed.split('\n').map(processInline).join('<br>');
                        html += `<p>${lines}</p>`;
                    }
                }

                return `<div class="answer-content">${html || '<p>No response available.</p>'}</div>`;
            }

            function initializeReasoningCollapse() {
                $(".reasoning-header").off("click").on("click", function() {
                    const content = $(this).next(".reasoning-content");
                    const icon = $(this).find(".toggle-icon");
                    
                    content.slideToggle(300);
                    icon.toggleClass("fa-chevron-down fa-chevron-up");
                });
            }

            // ✅ ADD THIS NEW FUNCTION HERE
            window.sendCommand = function(command) {
                const date = new Date();
                const hour = date.getHours().toString().padStart(2, '0');
                const minute = date.getMinutes().toString().padStart(2, '0');
                const str_time = hour + ":" + minute;

                // Display user's command in chat
                const userHtml = `
                    <div class="d-flex justify-content-end mb-4">
                        <div class="msg_cotainer_send">
                            ${escapeHtml(command)}
                            <span class="msg_time_send">${str_time}</span>
                        </div>
                        <div class="img_cont_msg">
                            <img src="https://i.ibb.co/d5b84Xw/Untitled-design.png"
                                 class="rounded-circle user_img_msg">
                        </div>
                    </div>
                `;

                $("#messageFormeight").append(userHtml);
                scrollToBottom();

                // Show typing indicator
                showTypingIndicator();

                // Send to backend
                $.ajax({
                    data: {
                        msg: command,
                        show_reasoning: reasoningEnabled
                    },
                    type: "POST",
                    url: "/get",
                    timeout: 180000,
                    dataType: "json"  // Expect JSON response
                }).done(function(data) {
                    hideTypingIndicator();

                    // Build HTML from JSON response
                    const formattedResponse = buildResponseFromJSON(data);

                    const botHtml = `
                        <div class="d-flex justify-content-start align-items-start mb-4">
                            <div class="img_cont_msg" style="flex-shrink:0;">
                                <img src="https://img.icons8.com/color/96/medical-doctor.png"
                                     class="rounded-circle bot_avatar_img">
                            </div>
                            <div class="msg_cotainer">
                                ${formattedResponse || '<div class="answer-section"><div class="answer-content"><p>No response received.</p></div></div>'}
                                <span class="msg_time">${str_time}</span>
                            </div>
                        </div>
                    `;

                    $("#messageFormeight").append(botHtml);
                    scrollToBottom();

                    // // Special handling for reset
                    // if (command.toLowerCase() === 'reset') {
                    //     setTimeout(() => {
                    //         const lastMessage = $("#messageFormeight").children().last();
                    //         $("#messageFormeight").html("");
                    //         $("#messageFormeight").append(lastMessage);
                    //     }, 800);
                    // }

                }).fail(function(jqXHR, textStatus, errorThrown) {
                    hideTypingIndicator();

                    const errorHtml = `
                        <div class="d-flex justify-content-start mb-4">
                            <div class="img_cont_msg">
                                <img src="https://img.icons8.com/color/96/medical-doctor.png" 
                                     class="rounded-circle bot_avatar_img">
                            </div>
                            <div class="msg_cotainer error-message">
                                ⚠️ <strong>Error:</strong> ${
                                    textStatus === 'timeout'
                                        ? 'Request timed out. Please try again.'
                                        : 'Something went wrong. Please try again.'
                                }
                                <span class="msg_time">${str_time}</span>
                            </div>
                        </div>
                    `;

                    $("#messageFormeight").append(errorHtml);
                    scrollToBottom();
                });
            };
        });
    </script>
</body>
</html>
